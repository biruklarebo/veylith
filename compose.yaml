# Every container in the stack lives here. Each one gets its own top-level
# folder with its Dockerfile, and stack.sh controls it automatically.
# Services reach each other by service name (e.g. http://frontend:8080).
# Settings and secrets come from .env, which stack.sh creates on first use.
name: veylith

services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-veylith}:${POSTGRES_PASSWORD:?run ./stack.sh to create .env}@database:5432/${POSTGRES_DB:-veylith}
      JWT_SECRET: ${JWT_SECRET:?run ./stack.sh to create .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:-}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:-}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  # Published on this machine only, for your own database apps. Other devices can't reach it.
  database:
    build:
      context: ./database
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veylith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./stack.sh to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-veylith}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # All app data. Survives rebuilds and `down`.
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Prisma Studio, to browse and edit the data. Only runs with: ./stack.sh db studio
  # Studio only listens on localhost, so it shares this machine's network and reaches the
  # database through its published port.
  studio:
    build: ./backend
    profiles: [tools]
    network_mode: host
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-veylith}:${POSTGRES_PASSWORD:?run ./stack.sh to create .env}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-veylith}
    command: ["./node_modules/.bin/prisma", "studio", "--port", "${STUDIO_PORT:-5555}", "--browser", "none"]

volumes:
  database_data:
